name: Phase 3 - XAML behaviour measurements

# Fills in the XAML behaviour database. The oracle is the real Windows.UI.Xaml
# runtime, which exists only on Windows, so this is the one workflow in the
# repository that cannot run on ubuntu-latest.
#
# Measurements are committed as text. No SDK payload, package, or binary from
# the run enters the repository.

on:
  push:
    paths:
      - 'phase3/**'
      # The pinned snapshots the harvests are held to reproducing. Without
      # these, editing one by hand would not run the job that checks it.
      - 'research/windows-terminal/**'
      - 'research/nuget/microsoft.windows.sdk.contracts/**'
      - '.github/workflows/phase3_xaml_measure.yml'
  pull_request:
    paths:
      - 'phase3/**'
      # The pinned snapshots the harvests are held to reproducing. Without
      # these, editing one by hand would not run the job that checks it.
      - 'research/windows-terminal/**'
      - 'research/nuget/microsoft.windows.sdk.contracts/**'
      - '.github/workflows/phase3_xaml_measure.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The level 7 cases are harvested from Terminal's own markup, so
      # reproducing them needs the exact source they came from. The commit is
      # read from the harvest rather than pinned twice.
      - name: Resolve the harvested Terminal commit
        id: terminal
        shell: bash
        run: |
          set -euo pipefail
          # nullglob so an unmatched pattern is an empty list rather than the
          # literal pattern, which would otherwise read as one missing file.
          shopt -s nullglob
          # Exactly one of each, so a second snapshot cannot be silently ignored.
          inventories=(research/windows-terminal/*/xaml-inventory.json)
          members=(research/nuget/microsoft.windows.sdk.contracts/*/xaml-members.json)
          for name in inventories members; do
            declare -n found="$name"
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected exactly one $name, found ${#found[@]}: ${found[*]}"
              exit 1
            fi
          done
          commit=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['source']['commit'])" "${inventories[0]}")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "inventory=${inventories[0]}" >> "$GITHUB_OUTPUT"
          echo "members=${members[0]}" >> "$GITHUB_OUTPUT"
          # Beside the inventory, and pinned to the same commit: the icon-font
          # codepoints Terminal's markup names. The font harvest below is told
          # which glyphs to read from this file rather than from a hand-typed
          # list that would go stale the first time Terminal changed an icon.
          echo "glyphs=$(dirname "${inventories[0]}")/icon-glyphs.json" >> "$GITHUB_OUTPUT"
          echo "harvested from microsoft/terminal $commit"

      - name: Check out Microsoft Terminal
        uses: actions/checkout@v4
        with:
          repository: microsoft/terminal
          ref: ${{ steps.terminal.outputs.commit }}
          path: _terminal
          fetch-depth: 1

      # WinUI 2's theme dictionary. Terminal names about two hundred resource
      # keys it never defines; most of them are WinUI 2's, and without them the
      # markup that uses them cannot be realised standalone at all. The
      # extractor reimplements the build-time merge that produces the
      # dictionary -- see the script -- so this needs the source and not a
      # built package.
      #
      # Blobless and sparse: the theme XAML and the three project files that
      # decide the merge order are a few megabytes of a repository that is
      # otherwise about a gigabyte.
      - name: Check out WinUI 2.8.4
        shell: bash
        run: |
          set -euo pipefail
          commit=$(python3 -c "import sys; sys.path.insert(0, 'phase3/scripts'); \
            import extract_winui_theme_resources as e; print(e.PINNED_COMMIT)")
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/microsoft/microsoft-ui-xaml _winui
          git -C _winui sparse-checkout set --cone dev tools FeatureAreas.props
          git -C _winui fetch --depth 1 origin "$commit"
          git -C _winui checkout --detach "$commit"
          echo "winui at $(git -C _winui rev-parse HEAD)"

      # Twice, into separate files, for the same reason the corpus is generated
      # twice: it is untracked output, and determinism is what stands in for a
      # committed copy to diff against.
      - name: Extract the application dictionary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3/xaml-db/theme-resources
          for out in phase3/xaml-db/theme-resources/winui-2.8.4.json "$RUNNER_TEMP/theme-check.json"; do
            python3 -B phase3/scripts/extract_winui_theme_resources.py _winui --out "$out"
          done
          if ! diff -q phase3/xaml-db/theme-resources/winui-2.8.4.json \
                       "$RUNNER_TEMP/theme-check.json" >/dev/null; then
            echo "::error::two extractor runs disagree; the dictionary is not deterministic"
            exit 1
          fi

      # The layer underneath that dictionary: the framework's own generic.xaml
      # and WinUI 2's default styles. The system file lives in the dxaml
      # publication of the same repository at a different commit, so it is a
      # second sparse checkout, not a second repository. The database lands in
      # the same directory as the theme dictionary because measure_cases reads
      # the two halves from one place -- a run that had one without the other
      # would resolve a {ThemeResource} in a default style against a
      # dictionary that is missing its floor.
      - name: Check out the XAML core publication
        shell: bash
        run: |
          set -euo pipefail
          commit=$(python3 -c "import sys; sys.path.insert(0, 'phase3/scripts'); \
            import extract_default_styles as e; print(e.PINNED_DXAML_COMMIT)")
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/microsoft/microsoft-ui-xaml _dxaml
          git -C _dxaml sparse-checkout set --cone dxaml/xcp/dxaml/themes
          git -C _dxaml fetch --depth 1 origin "$commit"
          git -C _dxaml checkout --detach "$commit"
          echo "dxaml at $(git -C _dxaml rev-parse HEAD)"

      - name: Extract the default-style database
        shell: bash
        run: |
          set -euo pipefail
          for out in phase3/xaml-db/theme-resources/default-styles.json "$RUNNER_TEMP/styles-check.json"; do
            python3 -B phase3/scripts/extract_default_styles.py \
              --dxaml _dxaml --winui _winui --out "$out"
          done
          if ! diff -q phase3/xaml-db/theme-resources/default-styles.json \
                       "$RUNNER_TEMP/styles-check.json" >/dev/null; then
            echo "::error::two extractor runs disagree; the database is not deterministic"
            exit 1
          fi

      # The cases are not committed: the generators are the source and this
      # step materializes their output. It runs twice into separate trees and
      # diffs them, because an untracked corpus can no longer be checked
      # against a committed copy -- determinism is what stands in for that.
      - name: Generate the case corpus
        shell: bash
        run: |
          rm -rf phase3/xaml-db/cases _corpus-check
          for out in phase3/xaml-db/cases _corpus-check; do
            python3 -B phase3/scripts/generate_cases.py --out "$out"
            python3 -B phase3/scripts/harvest_terminal_xaml.py _terminal \
              --members "${{ steps.terminal.outputs.members }}" \
              --inventory "${{ steps.terminal.outputs.inventory }}" \
              --theme-resources phase3/xaml-db/theme-resources/winui-2.8.4.json \
              --cases "$out/L7-terminal"
          done
          if ! diff -r phase3/xaml-db/cases _corpus-check >/dev/null; then
            echo "::error::two generator runs disagree; the corpus is not deterministic"
            diff -r phase3/xaml-db/cases _corpus-check | head -40
            exit 1
          fi
          rm -rf _corpus-check

      # Rendering needs a deliberately small corpus: capturing the entire
      # layout database as BGRA would create hundreds of megabytes while still
      # barely exercising paint. These authored programs isolate the stable
      # boundaries the renderer consumes: pixels, effective transforms, clips,
      # opacity, ordering and composition-visual state.
      - name: Generate the render-oracle corpus
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/render-cases-1" "$RUNNER_TEMP/render-cases-2"
          python3 -B phase3/scripts/generate_render_cases.py --out "$RUNNER_TEMP/render-cases-1"
          python3 -B phase3/scripts/generate_render_cases.py --out "$RUNNER_TEMP/render-cases-2"
          diff -r "$RUNNER_TEMP/render-cases-1" "$RUNNER_TEMP/render-cases-2"

      # The icon-font codepoints Terminal's markup names, extracted from the
      # same checkout by the same scoping rules the level 7 harvest uses. This
      # is research data rather than corpus data, so it is committed and held to
      # reproducing, exactly like the vocabulary inventory beside it.
      - name: Harvest the icon glyph set
        shell: bash
        run: |
          python3 -B phase3/scripts/harvest_icon_glyphs.py _terminal \
            --output "${{ steps.terminal.outputs.glyphs }}"

      # The harvests also rewrite the committed files under research/; those are
      # tracked, so hand edits still show as a diff.
      - name: Harvests are reproducible
        shell: bash
        run: |
          tracked=("${{ steps.terminal.outputs.inventory }}" "${{ steps.terminal.outputs.glyphs }}")
          git add -A -- "${tracked[@]}"
          if ! git diff --cached --quiet -- "${tracked[@]}"; then
            echo "::error::a committed harvest differs from the harvester output"
            git diff --cached --stat -- "${tracked[@]}"
            exit 1
          fi

      - name: Run harvester tests
        shell: bash
        run: python3 -m unittest discover -s phase3/tests -v

      - name: Record the oracle identity
        shell: pwsh
        run: |
          $os = (Get-CimInstance Win32_OperatingSystem).Version
          $ubr = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR
          # A TTF carries no VersionInfo resource, so FileVersion reads back
          # empty. The file hash identifies the font just as exactly and moves
          # for the same reason -- the font being serviced.
          $font = (Get-FileHash C:\Windows\Fonts\segoeui.ttf -Algorithm SHA256).Hash
          "os_build=$os.$ubr"  | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "font_segoeui=$font" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          Write-Host "oracle: windows $os.$ubr, Segoe UI sha256 $font"
          if (-not $font) { Write-Error "no Segoe UI hash; the oracle would be unidentified"; exit 1 }

          # The icon fonts the FontIcon cases measure, on the same terms. These
          # are recorded rather than required: which of them the runner image
          # ships is not ours to assume, and an absent one is a fact about the
          # oracle rather than a broken run. Empty means "this runner had none".
          foreach ($pair in @(@('font_segmdl2', 'segmdl2.ttf'),
                              @('font_segoeicons', 'SegoeIcons.ttf'))) {
            $path = "C:\Windows\Fonts\$($pair[1])"
            $hash = if (Test-Path $path) { (Get-FileHash $path -Algorithm SHA256).Hash } else { '' }
            "$($pair[0])=$hash" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
            Write-Host "  $($pair[1]) sha256 $(if ($hash) { $hash } else { '(absent)' })"
          }

      # Text measurement needs numbers that live inside the font file. The
      # font cannot be committed, so only the metrics travel -- and they are
      # checked against what the recorded measurements independently imply, so
      # a disagreement fails here rather than turning into wrong pixel widths.
      #
      # The harvest lands in fonts/, never in fonts/derived/: the two are
      # different claims about the font and measure_cases refuses a directory
      # holding both.
      - name: Harvest the font metrics
        shell: bash
        run: |
          python3 -B phase3/scripts/harvest_font_metrics.py \
            "C:/Windows/Fonts/segoeui.ttf" \
            --family "Segoe UI" \
            --expect phase3/xaml-db/fonts/derived/segoe-ui.json \
            --output "phase3/xaml-db/fonts/segoe-ui.json"
          test -s phase3/xaml-db/fonts/segoe-ui.json

      # The font Terminal ships and one level 7 case measures in.
      # L7-terminal-4edb490008 is a TextBlock with FontFamily="Cascadia Mono",
      # and the oracle records its empty line box as 16.2695 at font size 14 --
      # a ratio of 1.162109, which is 2380/2048 and is this file's hhea exactly.
      # None of the three families above is near it (Segoe UI is 1.330078), so
      # the runtime did not fall back: it measured in Cascadia Mono, and the
      # only thing missing was a reading of the font.
      #
      # Read out of the pinned Terminal checkout rather than off the runner.
      # That is where the file the recording matches lives, and its identity
      # travels with the commit the whole level 7 harvest is already pinned to,
      # so it needs no hash of its own beside the Segoe UI one.
      #
      # Not a warning if absent, unlike the icon fonts: this path is inside a
      # checkout at a known commit rather than whatever the runner image ships,
      # so a missing file means the harvest is looking in the wrong place.
      - name: Harvest the metrics of the font Terminal ships
        shell: bash
        run: |
          python3 -B phase3/scripts/harvest_font_metrics.py \
            "_terminal/res/fonts/CascadiaMono.ttf" \
            --family "Cascadia Mono" \
            --output "phase3/xaml-db/fonts/cascadia-mono.json"
          test -s phase3/xaml-db/fonts/cascadia-mono.json

      # The icon fonts, for the codepoints Terminal's markup actually names.
      # Fifteen level 7 cases are one FontIcon each and every one of them is
      # blocked on these numbers rather than on layout.
      #
      # Three differences from the text harvest above, all deliberate:
      #
      #  * `--missing record` — an icon font is allowed not to have a glyph.
      #    Segoe Fluent Icons and Segoe MDL2 Assets do not cover the same set,
      #    which is the entire reason Terminal writes them as a fallback list,
      #    so an absent codepoint is a fact to record and not a failed harvest.
      #    A font covering *none* of them still fails, inside the script: that
      #    is the wrong file rather than a font with a gap.
      #  * no `--expect` — nothing has solved an icon font's metrics out of the
      #    recorded measurements yet, because until this run there were no
      #    FontIcon cases to solve from. The L4-icon series is what makes that
      #    possible next time; see phase3/xaml-db/fonts/README.md.
      #  * a missing file is a warning, not a failure. Which icon fonts ship is
      #    the runner image's business, and losing the whole measurement run
      #    over one absent font would throw away the oracle for everything else.
      - name: Harvest the icon font metrics
        shell: bash
        run: |
          set -euo pipefail
          harvest() {
            local file="$1" family="$2" out="$3"
            if [ ! -f "$file" ]; then
              echo "::warning::$file is not on this runner; no metrics for \"$family\""
              return 0
            fi
            python3 -B phase3/scripts/harvest_font_metrics.py "$file" \
              --family "$family" \
              --codepoints-from "${{ steps.terminal.outputs.glyphs }}" \
              --missing record \
              --output "$out"
          }
          harvest "C:/Windows/Fonts/segmdl2.ttf"   "Segoe MDL2 Assets"  \
                  "phase3/xaml-db/fonts/segoe-mdl2-assets.json"
          harvest "C:/Windows/Fonts/SegoeIcons.ttf" "Segoe Fluent Icons" \
                  "phase3/xaml-db/fonts/segoe-fluent-icons.json"
          ls -l phase3/xaml-db/fonts/*.json

      # A FontFamily list is not the end of Windows text fallback. When none of
      # its named faces covers a FontIcon glyph, DirectWrite maps a system face
      # and a scale. Record that decision from the oracle machine, then harvest
      # the mapped file through the same sfnt reader as every explicit family.
      # The discovery script reads the generated corpus; no case id, glyph,
      # fallback family, desired size or machine path is committed.
      - name: Build the DirectWrite font fallback probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR echo ::error::no Visual Studio with the x64 C++ toolset && exit /b 1
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc ^
             /Fe:phase3\harness\font_fallback_probe.exe ^
             phase3\harness\font_fallback_probe.cpp ^
             /link dwrite.lib ole32.lib || exit /b 1

      - name: Harvest DirectWrite system font fallback
        shell: bash
        run: |
          python3 -B phase3/scripts/harvest_system_font_fallbacks.py \
            --cases phase3/xaml-db/cases \
            --fonts phase3/xaml-db/fonts \
            --probe phase3/harness/font_fallback_probe.exe

      - name: Build the probe
        shell: cmd
        run: |
          rem The edition and version of Visual Studio on the runner image are
          rem not ours to assume, so ask the installer where it put itself.
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR echo ::error::no Visual Studio with the x64 C++ toolset && exit /b 1
          echo using %VSDIR%
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem The manifest is not optional: XAML Islands refuses to start in a
          rem process that does not declare a maxversiontested.
          cl /nologo /std:c++20 /EHsc /DWIN32_LEAN_AND_MEAN ^
             /Fe:phase3\harness\xaml_probe.exe phase3\harness\xaml_probe.cpp ^
             /link windowsapp.lib ^
             /MANIFEST:EMBED /MANIFESTINPUT:phase3\harness\xaml_probe.manifest || exit /b 1

      - name: Build the render-boundary probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR echo ::error::no Visual Studio with the x64 C++ toolset && exit /b 1
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++20 /EHsc /DWIN32_LEAN_AND_MEAN ^
             /Fe:phase3\harness\xaml_render_probe.exe ^
             phase3\harness\xaml_render_probe.cpp ^
             /link windowsapp.lib user32.lib ^
             /MANIFEST:EMBED /MANIFESTINPUT:phase3\harness\xaml_probe.manifest || exit /b 1

      - name: Build the DirectWrite glyph-boundary probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR echo ::error::no Visual Studio with the x64 C++ toolset && exit /b 1
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc ^
             /Fe:phase3\harness\dwrite_glyph_probe.exe ^
             phase3\harness\dwrite_glyph_probe.cpp ^
             /link dwrite.lib ole32.lib || exit /b 1

      # The ink, as outlines, for the families whose outlines may be recorded.
      # 113 render cases refuse with "DirectWrite could not resolve any
      # requested family in \"Segoe UI\"": they lay out against harvested
      # metrics and then reach the draw with nothing to draw, because a widths
      # table cannot be painted. Recording shapes the way widths are already
      # recorded is the only route to those pixels that does not install a font
      # we do not have or invent one.
      #
      # Outlines are a different licensing claim from metrics -- the design is
      # generally not copyrightable, the outline data generally is -- and
      # harvest_glyph_outlines.py refuses any family not in its committed
      # CLEARED list. Cascadia Mono is on it because it is SIL OFL and Terminal
      # ships the file, and it is what the pipeline was proven on. Segoe UI is
      # on it by the repository owner's recorded decision (2026-08-11): a
      # proprietary typeface, harvested on the recorded terms that the outlines
      # live only in this run's artifact, read fresh each run from the font
      # file Microsoft installs on the runner, and never enter the repository.
      # Putting a family there is a human decision made in a reviewable commit,
      # not something this workflow can do.
      - name: Build the glyph outline probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR echo ::error::no Visual Studio with the x64 C++ toolset && exit /b 1
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc ^
             /Fe:phase3\harness\glyph_outline_probe.exe ^
             phase3\harness\glyph_outline_probe.cpp ^
             /link dwrite.lib ole32.lib || exit /b 1

      # --font-file, not a family lookup: Cascadia Mono is not installed on the
      # runner, it is a file in the pinned Terminal checkout, which is also
      # where its metrics were read from one step above. Every advance in the
      # outline reading is checked against every advance in the metrics
      # reading, so agreement means both came off the same glyphs of the same
      # file -- and the file's SHA-256 is compared too.
      - name: Harvest the glyph outlines of the font Terminal ships
        shell: bash
        run: |
          python3 -B phase3/scripts/harvest_glyph_outlines.py \
            --family "Cascadia Mono" \
            --metrics phase3/xaml-db/fonts/cascadia-mono.json \
            --probe phase3/harness/glyph_outline_probe.exe \
            --font-file "_terminal/res/fonts/CascadiaMono.ttf" \
            --output phase3/xaml-db/glyph-outlines/cascadia-mono.json
          test -s phase3/xaml-db/glyph-outlines/cascadia-mono.json

      # No --font-file: Segoe UI exists here only as an installed face, so the
      # probe resolves it through the system collection -- the normal weight,
      # stretch and style, with a simulated face refused by name, because a
      # simulation's outlines are not the font's. The identity still pins the
      # same way the Cascadia harvest's does: the driver re-hashes the file the
      # probe resolved and compares it against the SHA-256 the metrics harvest
      # recorded off C:/Windows/Fonts/segoeui.ttf, which is the same hash this
      # run already published as its oracle identity (font_segoeui). Every
      # design advance is cross-checked against the metrics reading, so the
      # shapes and the widths provably came off the same glyphs of the same
      # file. The recording rides in this run's artifact and nowhere else.
      - name: Harvest the glyph outlines of Segoe UI
        shell: bash
        run: |
          python3 -B phase3/scripts/harvest_glyph_outlines.py \
            --family "Segoe UI" \
            --metrics phase3/xaml-db/fonts/segoe-ui.json \
            --probe phase3/harness/glyph_outline_probe.exe \
            --output phase3/xaml-db/glyph-outlines/segoe-ui.json
          test -s phase3/xaml-db/glyph-outlines/segoe-ui.json

      # An uncleared family must be refused by the script and not by the
      # absence of a step asking for it. Asserting the refusal here means the
      # licence gate is exercised on every run rather than trusted. Segoe MDL2
      # Assets is the target because it is genuinely still uncleared -- also
      # Microsoft's, also on the runner, and nobody has made the call for it --
      # so the assertion stays a real refusal now that Segoe UI passes.
      - name: The licence gate refuses an uncleared family
        shell: bash
        run: |
          if python3 -B phase3/scripts/harvest_glyph_outlines.py \
               --family "Segoe MDL2 Assets" \
               --metrics phase3/xaml-db/fonts/segoe-mdl2-assets.json \
               --probe phase3/harness/glyph_outline_probe.exe \
               --output "$RUNNER_TEMP/segoe-mdl2-assets-outlines.json"; then
            echo "::error::Segoe MDL2 Assets outlines were harvested; the licence gate did not hold"
            exit 1
          fi
          test ! -f "$RUNNER_TEMP/segoe-mdl2-assets-outlines.json"
          echo "the licence gate refused Segoe MDL2 Assets, as it must"

      # RenderTargetBitmap is the stable XAML output boundary. Raw BGRA stays
      # in the workflow artifact (never the repository); reviewable JSON holds
      # the visual tree, environment, dimensions and exact content hashes.
      - name: Capture XAML render boundaries twice
        shell: cmd
        run: |
          phase3\harness\xaml_render_probe.exe %RUNNER_TEMP%\render-cases-1 %RUNNER_TEMP%\render-run1
          phase3\harness\xaml_render_probe.exe %RUNNER_TEMP%\render-cases-1 %RUNNER_TEMP%\render-run2

      - name: Finalize and verify render observations
        shell: bash
        run: |
          for run in 1 2; do
            cp -r "$RUNNER_TEMP/render-cases-1" "$RUNNER_TEMP/render-run${run}/cases"
            python3 -B phase3/scripts/harvest_dwrite_glyph_runs.py \
              --cases "$RUNNER_TEMP/render-cases-1" \
              --probe phase3/harness/dwrite_glyph_probe.exe \
              --output "$RUNNER_TEMP/render-run${run}/dwrite-glyph-runs.json"
          done
          python3 -B phase3/scripts/finalize_render_observations.py "$RUNNER_TEMP/render-run1"
          python3 -B phase3/scripts/finalize_render_observations.py "$RUNNER_TEMP/render-run2"
          if ! diff -r "$RUNNER_TEMP/render-run1" "$RUNNER_TEMP/render-run2" \
                     > "$RUNNER_TEMP/render-nondet.txt"; then
            echo "::error::native XAML pixels or visual state differ between identical runs"
            head -40 "$RUNNER_TEMP/render-nondet.txt"
            exit 1
          fi
          cat > "$RUNNER_TEMP/render-run1/oracle.json" <<EOF
          {
           "schema_version": 1,
           "os_build": "${os_build}",
           "fonts": {
            "Segoe UI": "${font_segoeui}",
            "Segoe MDL2 Assets": "${font_segmdl2}",
            "Segoe Fluent Icons": "${font_segoeicons}"
           },
           "xaml": "Windows.UI.Xaml (in-OS)",
           "capture_boundary": "RenderTargetBitmap BGRA8 premultiplied",
           "native_api_call_log": false,
           "desktop_composition_capture": false
          }
          EOF
          echo "native XAML render observations are deterministic across two runs"

      # Two independent runs into separate directories. Layout numbers that
      # differ between them are not usable as expectations, and the corpus is
      # worth nothing if it is not deterministic, so this gate comes before
      # anything is published.
      - name: Measure twice
        shell: cmd
        run: |
          phase3\harness\xaml_probe.exe phase3\xaml-db\cases %RUNNER_TEMP%\run1
          phase3\harness\xaml_probe.exe phase3\xaml-db\cases %RUNNER_TEMP%\run2

      - name: Measurements are deterministic
        shell: bash
        run: |
          if ! diff -r "$RUNNER_TEMP/run1" "$RUNNER_TEMP/run2" > "$RUNNER_TEMP/nondet.txt"; then
            echo "::error::measurements differ between two runs on the same machine"
            head -40 "$RUNNER_TEMP/nondet.txt"
            exit 1
          fi
          echo "deterministic across two runs"

      - name: Publish into the database
        shell: bash
        run: |
          dest="phase3/xaml-db/measurements/${os_build}"
          mkdir -p "$dest"
          cp -f "$RUNNER_TEMP"/run1/*.json "$dest/"
          # font_segoeui stays a top-level field: it is what the committed
          # digest compares against, and moving it would re-baseline every
          # stored oracle. The icon fonts go beside it in "fonts", which the
          # digest carries but does not yet compare -- nothing has been measured
          # against them before this run, so there is no stored value to drift
          # from. Once the L4-icon measurements exist, that is the moment to
          # start comparing them.
          cat > "$dest/oracle.json" <<EOF
          {
           "schema_version": 1,
           "os_build": "${os_build}",
           "font_segoeui": "${font_segoeui}",
           "fonts": {
            "Segoe UI": "${font_segoeui}",
            "Segoe MDL2 Assets": "${font_segmdl2}",
            "Segoe Fluent Icons": "${font_segoeicons}"
           },
           "xaml": "Windows.UI.Xaml (in-OS)"
          }
          EOF
          echo "cases measured: $(ls "$dest"/*.json | wc -l)"

      # Splits the outcome by level, because a failure means different things
      # for a case we wrote and a case we harvested. Fails the job only for the
      # former.
      - name: Report and quarantine
        shell: bash
        run: |
          dest="phase3/xaml-db/measurements/${os_build}"
          echo "oracle: windows ${os_build}, Segoe UI ${font_segoeui}" >> "$GITHUB_STEP_SUMMARY"
          python3 -B phase3/scripts/report_measurements.py \
            --cases phase3/xaml-db/cases \
            --measurements "$dest" \
            --output "$dest/report.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      # The other direction of the same check. The committed derived metrics
      # were solved out of measurements like these, and a servicing update that
      # moves the numbers must move that file too -- otherwise the harvest is
      # being checked against a stale statement about the font.
      - name: Derived metrics still follow from the measurements
        shell: bash
        run: |
          python3 -B phase3/scripts/derive_font_metrics.py \
            --measurements "phase3/xaml-db/measurements/${os_build}" \
            --output phase3/xaml-db/fonts/derived/segoe-ui.json \
            --check

      # The pair adjustments, which the same file carries and the step above
      # deliberately skips: they cannot be derived without the harvest, because
      # a word constrains the sum of its advances and not any one of them. So
      # this hands over the advances just read off the font and asks the fresh
      # measurements whether the committed pairs are still exactly right.
      #
      # Three checks, and each has caught something. The pairs the recorded
      # two-character runs imply have to be exactly the committed ones, at the
      # same values -- a missing pair and an extra one are both failures. Every
      # committed value has to be what the font's own tables say, GPOS winning
      # where they disagree. And the whole model has to reproduce every
      # recorded run, which is the only thing here that tests how far a pair
      # reaches: the run that found that out, "{StaticResource NotAKey}", is a
      # level 5 case and nothing else in this job looks at it.
      - name: The committed kerning is what the recorded runs imply
        shell: bash
        run: |
          python3 -B phase3/scripts/derive_font_metrics.py \
            --measurements "phase3/xaml-db/measurements/${os_build}" \
            --advances-from phase3/xaml-db/fonts/segoe-ui.json \
            --output phase3/xaml-db/fonts/derived/segoe-ui.json \
            --check-kerning

      # The measurements are not committed -- they are this job's artifact. The
      # digest of them is, so that a servicing update to Windows shows up as a
      # reviewable diff rather than quietly re-baselining every expectation.
      - name: Oracle has not drifted
        shell: bash
        run: |
          python3 -B phase3/scripts/measurement_digest.py \
            --measurements "phase3/xaml-db/measurements/${os_build}" \
            --oracles phase3/xaml-db/oracles

      # Always: a failing report is exactly when the measurements are worth
      # having, and skipping the upload on failure throws away the only copy
      # of what the runtime actually said.
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('phase3/xaml-db/measurements/**') != ''
        with:
          name: xaml-measurements-${{ env.os_build }}
          path: phase3/xaml-db/measurements/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xaml-render-boundaries-${{ env.os_build }}
          path: ${{ runner.temp }}/render-run1/
          if-no-files-found: warn

      # Its own artifact rather than a directory inside the measurements one,
      # so the layout the fetch script and the layout job already expect does
      # not move.
      #
      # The top-level *.json only: fonts/derived/ and the README are committed
      # and belong to the checkout, and an artifact that carried the derived
      # numbers alongside the harvested ones would be checking the harvest
      # against a copy of itself.
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('phase3/xaml-db/fonts/*.json') != ''
        with:
          name: xaml-fonts-${{ env.os_build }}
          path: phase3/xaml-db/fonts/*.json

      # The recorded ink. Its own artifact, not folded into xaml-fonts-*,
      # because it is a different kind of reading with a different licensing
      # story and the two must not be conflated by living in one directory.
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('phase3/xaml-db/glyph-outlines/*.json') != ''
        with:
          name: xaml-glyph-outlines-${{ env.os_build }}
          path: phase3/xaml-db/glyph-outlines/*.json

      # The cases are generator output and not committed, so the corpus the
      # oracle just measured travels as an artifact. The layout job measures
      # this exact corpus rather than regenerating its own, so both jobs are
      # answering the same question by construction.
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('phase3/xaml-db/cases/**') != ''
        with:
          name: xaml-cases-${{ env.os_build }}
          path: phase3/xaml-db/cases/

      # The dictionary the corpus was harvested against, travelling with it for
      # the same reason: the layout job must answer lookups out of the same
      # content the classifier assumed, or the two jobs are measuring different
      # corpora and neither says so.
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('phase3/xaml-db/theme-resources/*.json') != ''
        with:
          name: xaml-theme-resources-${{ env.os_build }}
          path: phase3/xaml-db/theme-resources/

      # Handed to the layout job, which needs to know both which artifact to
      # download and which directory inside it the oracle wrote.
      - name: Publish the oracle identity to dependent jobs
        id: oracle
        shell: bash
        run: |
          echo "artifact=xaml-measurements-${os_build}" >> "$GITHUB_OUTPUT"
          echo "fonts=xaml-fonts-${os_build}" >> "$GITHUB_OUTPUT"
          echo "cases=xaml-cases-${os_build}" >> "$GITHUB_OUTPUT"
          echo "theme=xaml-theme-resources-${os_build}" >> "$GITHUB_OUTPUT"
          echo "render_oracle=xaml-render-boundaries-${os_build}" >> "$GITHUB_OUTPUT"
          echo "os_build=${os_build}" >> "$GITHUB_OUTPUT"

    outputs:
      artifact: ${{ steps.oracle.outputs.artifact }}
      fonts: ${{ steps.oracle.outputs.fonts }}
      cases: ${{ steps.oracle.outputs.cases }}
      theme: ${{ steps.oracle.outputs.theme }}
      render_oracle: ${{ steps.oracle.outputs.render_oracle }}
      os_build: ${{ steps.oracle.outputs.os_build }}

  # The reimplementation, checked against what the runtime just answered. This
  # is the project's progress number, and unlike a screenshot comparison it
  # says exactly which primitive is wrong.
  #
  # On ubuntu, because the layout core deliberately depends on nothing: the
  # oracle already ran, and everything downstream of it is arithmetic against a
  # JSON file.
  layout:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.artifact }}
          path: measurements

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.fonts }}
          path: fonts

      # The corpus the oracle measured; cases are not committed.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.cases }}
          path: phase3/xaml-db/cases

      # And the application dictionary it was harvested against, so the lookups
      # here land in the same content the classifier assumed.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.theme }}
          path: phase3/xaml-db/theme-resources

      - name: Build the layout core
        run: |
          cmake -S phase3/layout -B "$RUNNER_TEMP/layout-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/layout-build" --parallel

      # Everything a measurement cannot reach. A tree of numbers cannot say
      # whether a value was inherited or copied, or whether clearing one
      # restored the ancestor or the default; and a case that is supposed to
      # fail has no measurement at all, so the corpus cannot check that a
      # resource lookup names the key it could not find rather than leaving
      # the property unset. Both suites run here.
      - name: What no measurement can check
        run: ctest --test-dir "$RUNNER_TEMP/layout-build" --output-on-failure

      # The XBF loader's driver and gate. The gate itself needs the harvested
      # SDK XAML compiler under Wine, which this runner does not have, so it
      # skips by name here -- but the driver's project generation and its
      # diagnostic parsing are pure text, and a mistake in either would turn
      # "the compiler rejected this page" into "no page was ever compiled".
      - name: The XBF loader's driver says what it did
        run: python3 -m unittest discover -s phase4/tests -v

      # Twice, into separate directories. The oracle is held to determinism and
      # so is the implementation -- a layout that moves between runs cannot be
      # compared against anything.
      #
      # The kerning rides in the artifact with everything else. That was not
      # always true: the run before this one applied every pair the font
      # carries and measured three cases too narrow, which is what the
      # `L4-kern` series was authored to explain. It did -- the values are the
      # font's after all, and what the recordings pin is how far each one
      # reaches. The step above holds the committed pairs to these very
      # measurements, so the harvest is checked rather than trusted.
      - name: Results are deterministic
        run: |
          for run in 1 2; do
            "$RUNNER_TEMP/layout-build/measure_cases" \
              phase3/xaml-db/cases "$RUNNER_TEMP/run$run" fonts
          done
          if ! diff -r "$RUNNER_TEMP/run1" "$RUNNER_TEMP/run2" > "$RUNNER_TEMP/nondet.txt"; then
            echo "::error::layout results differ between two runs on the same machine"
            head -40 "$RUNNER_TEMP/nondet.txt"
            exit 1
          fi

      # Every level, for the record. This step reports and never fails: the
      # levels that are not implemented yet are expected to be red, and burying
      # the numbers because of that would hide the progress the corpus exists
      # to measure.
      - name: Coverage across every level
        run: |
          {
            echo "### Layout core against ${{ needs.measure.outputs.os_build }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -B phase3/scripts/check_layout.py \
            --expected "measurements/${{ needs.measure.outputs.os_build }}" \
            --actual "$RUNNER_TEMP/run1" \
            --output layout-report.json \
            >> "$GITHUB_STEP_SUMMARY" || true

      # A resolved {StaticResource} and an applied Style are each held to the
      # twin case that writes the same values inline. That is self-consistency
      # and not coverage, and the report says so itself; it is here because it
      # fails loudly on the one thing a resource system gets wrong, which is
      # resolving to the wrong value, and on the one thing a style system gets
      # wrong, which is applying a setter at the wrong precedence.
      #
      # The recording goes in too, because the pairing is the corpus author's
      # claim and the oracle has refuted thirteen of them: an implicit Style
      # does not reach an element written below its dictionary, so half the
      # implicit-style pairs are two different layouts. A pair the recording
      # has differing is reported apart instead of demanded.
      - name: Resolved resources and applied styles match their inlined twins
        run: |
          python3 -B phase3/scripts/check_twins.py \
            --cases phase3/xaml-db/cases \
            --results "$RUNNER_TEMP/run1" \
            --expected "measurements/${{ needs.measure.outputs.os_build }}" \
            --output twin-report.json \
            --summary "$GITHUB_STEP_SUMMARY"

      # The levels the implementation claims. A regression here is a real
      # failure, which is what makes the claim worth anything.
      #
      # L0 is gated on the cases that have a measurement; a case with none is
      # no expectation at all, so the thirteen authored ahead of the next
      # oracle run do not count either way. When that run lands, three of them
      # ask questions the implementation currently guesses at -- whether
      # UseLayoutRounding inherits, and how a tie at exactly .5 breaks -- and
      # this step is where the answer will arrive, as a failure. That is the
      # answer, not a regression.
      #
      # L4 is not in the list even though it is implemented: it is only as good
      # as the harvested metrics, and holding it green here would make a change
      # in the runner's font read as a bug in this repository. The step above
      # reports it either way. The step below holds it to the derived metrics,
      # which are committed and therefore ours to be held to.
      - name: Implemented levels still match
        run: |
          python3 -B phase3/scripts/check_layout.py \
            --expected "measurements/${{ needs.measure.outputs.os_build }}" \
            --actual "$RUNNER_TEMP/run1" \
            --levels L0,L1,L2,L3

      # The committed derived metrics, on their own, against the same corpus.
      # They cover the text cases that need only a line height and the advance
      # of 'M'; every other text case must fail by naming the advance it has
      # not got. A case that instead lands close-but-wrong would mean the
      # derived file had started standing in for a harvest, which is the one
      # way this half could quietly stop meaning anything.
      #
      # L4 holds three groups now and they are held to different rules, so the
      # check splits on the case id rather than on the level:
      #
      #  * L4-text, L4-source and L4-kern are the TextBlock cases. The rule
      #    above is theirs and is unchanged: match, or name the advance you
      #    have not got. The kern cases mostly name one: their texts pair
      #    letters the corpus never measures alone, so on the derived file
      #    they refuse rather than reach the committed kerning at all.
      #  * L4-icon is FontIcon. Six of those measure an icon in Segoe UI, whose
      #    advance the corpus already knows, and they match here -- which is
      #    what they were authored for: the sizing rule is pinned before any
      #    icon metric is trusted. The rest name a family this directory has no
      #    metrics for, and must fail by name rather than by number. Holding
      #    them to the text rule would have failed this step for saying exactly
      #    what it is supposed to say.
      - name: The derived metrics match or say why not
        run: |
          "$RUNNER_TEMP/layout-build/measure_cases" \
            phase3/xaml-db/cases "$RUNNER_TEMP/derived" phase3/xaml-db/fonts/derived
          python3 -B phase3/scripts/check_layout.py \
            --expected "measurements/${{ needs.measure.outputs.os_build }}" \
            --actual "$RUNNER_TEMP/derived" \
            --levels L4 \
            --output derived-report.json > /dev/null || true
          python3 - <<'PY'
          import json, sys
          report = json.load(open("derived-report.json"))
          level = report["levels"].get("L4")
          if level is None:
              print("::error::no L4 case was compared; the text corpus has gone missing")
              sys.exit(1)
          def group(prefix):
              return [m for m in report["mismatches"]
                      if m["case_id"].startswith(prefix)]
          text = group("L4-text-") + group("L4-source-") + group("L4-kern-")
          icons = group("L4-icon-")
          known = {"L4-text-", "L4-source-", "L4-icon-", "L4-kern-"}
          other = [m for m in report["mismatches"]
                   if not any(m["case_id"].startswith(p) for p in known)]
          print(f"L4 on the derived metrics alone: {level['passed']} of "
                f"{level['cases']} match, {level['failed']} await the harvest")

          failed = False
          missing_advance = "implementation failed: the metrics derived from"
          wrong = [m for m in text if not m["detail"].startswith(missing_advance)]
          if wrong:
              print("::error::a text case measured against the derived metrics "
                    "neither matched nor named a missing advance")
              failed = True
          # FontIcon is a deliberate omission in the layout core, so an icon case
          # has to fail as a refusal. One that produced a number instead would
          # mean an icon metric had been invented somewhere.
          guessed = [m for m in icons
                     if not m["detail"].startswith("implementation failed:")]
          if guessed:
              print("::error::an icon case produced a number rather than a "
                    "refusal; something is inventing icon-font metrics")
              failed = True
          if other:
              print("::error::an L4 case belongs to no known group")
              failed = True
          for mismatch in (wrong + guessed + other)[:10]:
              print(f"  {mismatch['case_id']} {mismatch['path']}: {mismatch['detail']}")
          if not level["passed"]:
              print("::error::the derived metrics matched no text case at all")
              failed = True
          sys.exit(1 if failed else 0)
          PY

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('layout-report.json') != ''
        with:
          name: layout-report
          path: layout-report.json

  # The first pixels. Separate from the layout job because it answers a
  # different question with the same corpus: not "what size is everything" but
  # "which pixels does that turn into". Its original round-trip gate remains:
  # paint the layout corpus, recover every rectangle back out of the dumps, and
  # demand it be exactly the one the verified measurement path reports. Beside
  # that is the Wave 6 acceptance test: the focused corpus is compared directly
  # with pixels and visual state harvested from native Windows.UI.Xaml.
  #
  # On ubuntu, and with no Wine: the render core is plain C++17 and only the
  # glyph backend needs a platform. The dumps are a quarter of a gigabyte and
  # go to the runner's temp, never to an artifact.
  render:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.fonts }}
          path: fonts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.cases }}
          path: phase3/xaml-db/cases

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.theme }}
          path: phase3/xaml-db/theme-resources

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.render_oracle }}
          path: native-render-oracle

      # The recorded glyph outlines the measure job harvested. The name is
      # derived from os_build the same way the measure job derives it when
      # uploading, so the render job needs nothing new published to reach it.
      - uses: actions/download-artifact@v4
        with:
          name: xaml-glyph-outlines-${{ needs.measure.outputs.os_build }}
          path: glyph-outlines

      - name: Build the render core
        run: |
          cmake -S phase3/render -B "$RUNNER_TEMP/render-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/render-build" --parallel

      # What a dump cannot say. A refused case paints nothing, so its pixels
      # cannot show that refusing was the right answer rather than a renderer
      # that quietly did nothing.
      - name: What no dump can check
        run: ctest --test-dir "$RUNNER_TEMP/render-build" --output-on-failure

      # And what no dump can check on the checker itself: a gate that passed
      # everything would report the render pass as exact without looking.
      - name: The round-trip checker catches what it claims to
        run: python3 -m unittest discover -s phase4/tests -v

      # Twice, into separate directories, for the same reason the measurements
      # are: a render that moves between runs cannot be compared to anything.
      - name: Renders are deterministic
        run: |
          for run in 1 2; do
            "$RUNNER_TEMP/render-build/render_cases" \
              phase3/xaml-db/cases "$RUNNER_TEMP/render$run" fonts \
              --glyph-outlines glyph-outlines
          done
          if ! diff -r "$RUNNER_TEMP/render1" "$RUNNER_TEMP/render2" > "$RUNNER_TEMP/nondet.txt"; then
            echo "::error::renders differ between two runs on the same machine"
            head -40 "$RUNNER_TEMP/nondet.txt"
            exit 1
          fi

      # The render pass arranges the tree itself, so it has to arrange it the
      # way the verified measurement path does. Byte for byte, or the pixels
      # below are pixels of something else.
      - name: The render pass arranges what the measurement path arranges
        run: |
          cmake -S phase3/layout -B "$RUNNER_TEMP/layout-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/layout-build" --parallel
          "$RUNNER_TEMP/layout-build/measure_cases" \
            phase3/xaml-db/cases "$RUNNER_TEMP/measured" fonts
          # measure_cases writes a file for a case that failed to load; the
          # render harness puts that in the dump's sidecar instead, so the
          # trees directory is the measured one minus exactly those.
          missing=$(diff -r "$RUNNER_TEMP/render1/trees" "$RUNNER_TEMP/measured" \
                    | grep -c '^Only in' || true)
          content=$(diff -r "$RUNNER_TEMP/render1/trees" "$RUNNER_TEMP/measured" \
                    | grep -c '^[<>]' || true)
          errors=$(grep -l '"error"' "$RUNNER_TEMP"/measured/*.json | wc -l)
          echo "trees: $missing only-in, $content content diffs, $errors cases did not load"
          if [ "$content" -ne 0 ] || [ "$missing" -ne "$errors" ]; then
            echo "::error::the render pass does not arrange what the measurement path does"
            diff -r "$RUNNER_TEMP/render1/trees" "$RUNNER_TEMP/measured" | head -20
            exit 1
          fi

      # --glyph-outlines arms the artifact-present-family pin: the day an
      # outline document for a refusing family lands in the artifact, a run of
      # that family that keeps refusing is a failure here, not a row in the
      # refusal table. That is what makes the flip enforced rather than
      # observed, with no count named anywhere.
      - name: The round trip is pixel-exact
        run: |
          python3 -B phase4/scripts/check_render.py \
            --dumps "$RUNNER_TEMP/render1" \
            --glyph-outlines glyph-outlines \
            --output render-report.json \
            --summary "$GITHUB_STEP_SUMMARY"

      # This is a real acceptance test and therefore exits nonzero for every
      # mismatch: no tolerance and no expected-failure list. Wave 6 is not yet
      # complete, so the step is temporarily allowed to fail at the workflow
      # level. Its report and red step remain visible. Removing the one
      # continue-on-error line turns the already-strict test into the release
      # gate; the comparator itself does not change at that point.
      - name: Future gate - native XAML renderer acceptance
        id: native_render_acceptance
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/render-build/render_oracle_cases" \
            native-render-oracle/cases "$RUNNER_TEMP/native-acceptance-actual" \
            fonts phase3/xaml-db/theme-resources
          python3 -B phase4/scripts/check_render_oracle.py \
            --oracle native-render-oracle \
            --actual "$RUNNER_TEMP/native-acceptance-actual" \
            --output native-render-acceptance.json \
            --summary "$GITHUB_STEP_SUMMARY"

      # `continue-on-error` must not turn a crashed or vacuous comparator into
      # success. A mismatch writes a complete report before exiting 1; an
      # infrastructure error exits 2 without one and this independent step
      # fails the job. It also proves every harvested case reached the report.
      - name: The future acceptance test ran completely
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              manifest = json.load(open("native-render-oracle/manifest.json"))
              report = json.load(open("native-render-acceptance.json"))
          except (OSError, json.JSONDecodeError) as error:
              print(f"::error::native renderer acceptance did not produce a valid report: {error}")
              sys.exit(1)
          expected = len(manifest["captures"])
          summary = report["summary"]
          if summary["cases"] != expected or summary["passed"] + summary["failed"] != expected:
              print(f"::error::acceptance report covers {summary['cases']} of {expected} cases")
              sys.exit(1)
          print(f"acceptance accounted for all {expected} cases: "
                f"{summary['passed']} passed, {summary['failed']} failed")
          PY

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('render-report.json') != ''
        with:
          name: render-report
          path: render-report.json

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('native-render-acceptance.json') != ''
        with:
          name: native-render-acceptance-${{ needs.measure.outputs.os_build }}
          path: native-render-acceptance.json
