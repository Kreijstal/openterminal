name: Phase 3 - XAML behaviour measurements

# Fills in the XAML behaviour database. The oracle is the real Windows.UI.Xaml
# runtime, which exists only on Windows, so this is the one workflow in the
# repository that cannot run on ubuntu-latest.
#
# Measurements are committed as text. No SDK payload, package, or binary from
# the run enters the repository.

on:
  push:
    paths:
      - 'phase3/**'
      - '.github/workflows/phase3_xaml_measure.yml'
  pull_request:
    paths:
      - 'phase3/**'
      - '.github/workflows/phase3_xaml_measure.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The level 7 cases are harvested from Terminal's own markup, so
      # reproducing them needs the exact source they came from. The commit is
      # read from the harvest rather than pinned twice.
      - name: Resolve the harvested Terminal commit
        id: terminal
        shell: bash
        run: |
          set -euo pipefail
          # nullglob so an unmatched pattern is an empty list rather than the
          # literal pattern, which would otherwise read as one missing file.
          shopt -s nullglob
          # Exactly one of each, so a second snapshot cannot be silently ignored.
          inventories=(research/windows-terminal/*/xaml-inventory.json)
          members=(research/nuget/microsoft.windows.sdk.contracts/*/xaml-members.json)
          for name in inventories members; do
            declare -n found="$name"
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected exactly one $name, found ${#found[@]}: ${found[*]}"
              exit 1
            fi
          done
          commit=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['source']['commit'])" "${inventories[0]}")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "inventory=${inventories[0]}" >> "$GITHUB_OUTPUT"
          echo "members=${members[0]}" >> "$GITHUB_OUTPUT"
          echo "harvested from microsoft/terminal $commit"

      - name: Check out Microsoft Terminal
        uses: actions/checkout@v4
        with:
          repository: microsoft/terminal
          ref: ${{ steps.terminal.outputs.commit }}
          path: _terminal
          fetch-depth: 1

      - name: Regenerate the case corpus
        shell: bash
        run: |
          rm -rf phase3/xaml-db/cases
          python3 -B phase3/scripts/generate_cases.py
          python3 -B phase3/scripts/harvest_terminal_xaml.py _terminal \
            --members "${{ steps.terminal.outputs.members }}" \
            --inventory "${{ steps.terminal.outputs.inventory }}" \
            --cases phase3/xaml-db/cases/L7-terminal

      # Both the generated and the harvested cases are outputs of checked-in
      # scripts. A checkout whose cases differ from what those scripts emit
      # means someone edited cases by hand, which silently decouples the corpus
      # from its generator, so fail instead of proceeding.
      - name: Corpus is reproducible
        shell: bash
        run: |
          paths=(phase3/xaml-db/cases "${{ steps.terminal.outputs.inventory }}")
          # Stage first. A case deleted from the corpus comes back from the
          # regeneration as an *untracked* file, and `git diff` says nothing
          # about untracked files -- so diffing the worktree alone would let a
          # deletion through silently.
          git add -A -- "${paths[@]}"
          if ! git diff --cached --quiet -- "${paths[@]}"; then
            echo "::error::committed cases differ from the generator output"
            git diff --cached --stat -- "${paths[@]}"
            exit 1
          fi

      - name: Run harvester tests
        shell: bash
        run: python3 -m unittest discover -s phase3/tests -v

      - name: Record the oracle identity
        shell: pwsh
        run: |
          $os = (Get-CimInstance Win32_OperatingSystem).Version
          $ubr = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').UBR
          # A TTF carries no VersionInfo resource, so FileVersion reads back
          # empty. The file hash identifies the font just as exactly and moves
          # for the same reason -- the font being serviced.
          $font = (Get-FileHash C:\Windows\Fonts\segoeui.ttf -Algorithm SHA256).Hash
          "os_build=$os.$ubr"  | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "font_segoeui=$font" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          Write-Host "oracle: windows $os.$ubr, Segoe UI sha256 $font"
          if (-not $font) { Write-Error "no Segoe UI hash; the oracle would be unidentified"; exit 1 }

      # Text measurement needs numbers that live inside the font file. The
      # font cannot be committed, so only the metrics travel -- and they are
      # checked against what the recorded measurements independently imply, so
      # a disagreement fails here rather than turning into wrong pixel widths.
      #
      # The harvest lands in fonts/, never in fonts/derived/: the two are
      # different claims about the font and measure_cases refuses a directory
      # holding both.
      - name: Harvest the font metrics
        shell: bash
        run: |
          python3 -B phase3/scripts/harvest_font_metrics.py \
            "C:/Windows/Fonts/segoeui.ttf" \
            --family "Segoe UI" \
            --expect phase3/xaml-db/fonts/derived/segoe-ui.json \
            --output "phase3/xaml-db/fonts/segoe-ui.json"
          test -s phase3/xaml-db/fonts/segoe-ui.json

      - name: Build the probe
        shell: cmd
        run: |
          rem The edition and version of Visual Studio on the runner image are
          rem not ours to assume, so ask the installer where it put itself.
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR echo ::error::no Visual Studio with the x64 C++ toolset && exit /b 1
          echo using %VSDIR%
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem The manifest is not optional: XAML Islands refuses to start in a
          rem process that does not declare a maxversiontested.
          cl /nologo /std:c++20 /EHsc /DWIN32_LEAN_AND_MEAN ^
             /Fe:phase3\harness\xaml_probe.exe phase3\harness\xaml_probe.cpp ^
             /link windowsapp.lib ^
             /MANIFEST:EMBED /MANIFESTINPUT:phase3\harness\xaml_probe.manifest || exit /b 1

      # Two independent runs into separate directories. Layout numbers that
      # differ between them are not usable as expectations, and the corpus is
      # worth nothing if it is not deterministic, so this gate comes before
      # anything is published.
      - name: Measure twice
        shell: cmd
        run: |
          phase3\harness\xaml_probe.exe phase3\xaml-db\cases %RUNNER_TEMP%\run1
          phase3\harness\xaml_probe.exe phase3\xaml-db\cases %RUNNER_TEMP%\run2

      - name: Measurements are deterministic
        shell: bash
        run: |
          if ! diff -r "$RUNNER_TEMP/run1" "$RUNNER_TEMP/run2" > "$RUNNER_TEMP/nondet.txt"; then
            echo "::error::measurements differ between two runs on the same machine"
            head -40 "$RUNNER_TEMP/nondet.txt"
            exit 1
          fi
          echo "deterministic across two runs"

      - name: Publish into the database
        shell: bash
        run: |
          dest="phase3/xaml-db/measurements/${os_build}"
          mkdir -p "$dest"
          cp -f "$RUNNER_TEMP"/run1/*.json "$dest/"
          cat > "$dest/oracle.json" <<EOF
          {
           "schema_version": 1,
           "os_build": "${os_build}",
           "font_segoeui": "${font_segoeui}",
           "xaml": "Windows.UI.Xaml (in-OS)"
          }
          EOF
          echo "cases measured: $(ls "$dest"/*.json | wc -l)"

      # Splits the outcome by level, because a failure means different things
      # for a case we wrote and a case we harvested. Fails the job only for the
      # former.
      - name: Report and quarantine
        shell: bash
        run: |
          dest="phase3/xaml-db/measurements/${os_build}"
          echo "oracle: windows ${os_build}, Segoe UI ${font_segoeui}" >> "$GITHUB_STEP_SUMMARY"
          python3 -B phase3/scripts/report_measurements.py \
            --cases phase3/xaml-db/cases \
            --measurements "$dest" \
            --output "$dest/report.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      # The other direction of the same check. The committed derived metrics
      # were solved out of measurements like these, and a servicing update that
      # moves the numbers must move that file too -- otherwise the harvest is
      # being checked against a stale statement about the font.
      - name: Derived metrics still follow from the measurements
        shell: bash
        run: |
          python3 -B phase3/scripts/derive_font_metrics.py \
            --measurements "phase3/xaml-db/measurements/${os_build}" \
            --output phase3/xaml-db/fonts/derived/segoe-ui.json \
            --check

      # The measurements are not committed -- they are this job's artifact. The
      # digest of them is, so that a servicing update to Windows shows up as a
      # reviewable diff rather than quietly re-baselining every expectation.
      - name: Oracle has not drifted
        shell: bash
        run: |
          python3 -B phase3/scripts/measurement_digest.py \
            --measurements "phase3/xaml-db/measurements/${os_build}" \
            --oracles phase3/xaml-db/oracles

      # Always: a failing report is exactly when the measurements are worth
      # having, and skipping the upload on failure throws away the only copy
      # of what the runtime actually said.
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('phase3/xaml-db/measurements/**') != ''
        with:
          name: xaml-measurements-${{ env.os_build }}
          path: phase3/xaml-db/measurements/

      # Its own artifact rather than a directory inside the measurements one,
      # so the layout the fetch script and the layout job already expect does
      # not move.
      #
      # The top-level *.json only: fonts/derived/ and the README are committed
      # and belong to the checkout, and an artifact that carried the derived
      # numbers alongside the harvested ones would be checking the harvest
      # against a copy of itself.
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('phase3/xaml-db/fonts/*.json') != ''
        with:
          name: xaml-fonts-${{ env.os_build }}
          path: phase3/xaml-db/fonts/*.json

      # Handed to the layout job, which needs to know both which artifact to
      # download and which directory inside it the oracle wrote.
      - name: Publish the oracle identity to dependent jobs
        id: oracle
        shell: bash
        run: |
          echo "artifact=xaml-measurements-${os_build}" >> "$GITHUB_OUTPUT"
          echo "fonts=xaml-fonts-${os_build}" >> "$GITHUB_OUTPUT"
          echo "os_build=${os_build}" >> "$GITHUB_OUTPUT"

    outputs:
      artifact: ${{ steps.oracle.outputs.artifact }}
      fonts: ${{ steps.oracle.outputs.fonts }}
      os_build: ${{ steps.oracle.outputs.os_build }}

  # The reimplementation, checked against what the runtime just answered. This
  # is the project's progress number, and unlike a screenshot comparison it
  # says exactly which primitive is wrong.
  #
  # On ubuntu, because the layout core deliberately depends on nothing: the
  # oracle already ran, and everything downstream of it is arithmetic against a
  # JSON file.
  layout:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.artifact }}
          path: measurements

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.measure.outputs.fonts }}
          path: fonts

      - name: Build the layout core
        run: |
          cmake -S phase3/layout -B "$RUNNER_TEMP/layout-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/layout-build" --parallel

      # Twice, into separate directories. The oracle is held to determinism and
      # so is the implementation -- a layout that moves between runs cannot be
      # compared against anything.
      - name: Results are deterministic
        run: |
          for run in 1 2; do
            "$RUNNER_TEMP/layout-build/measure_cases" \
              phase3/xaml-db/cases "$RUNNER_TEMP/run$run" fonts
          done
          if ! diff -r "$RUNNER_TEMP/run1" "$RUNNER_TEMP/run2" > "$RUNNER_TEMP/nondet.txt"; then
            echo "::error::layout results differ between two runs on the same machine"
            head -40 "$RUNNER_TEMP/nondet.txt"
            exit 1
          fi

      # Every level, for the record. This step reports and never fails: the
      # levels that are not implemented yet are expected to be red, and burying
      # the numbers because of that would hide the progress the corpus exists
      # to measure.
      - name: Coverage across every level
        run: |
          {
            echo "### Layout core against ${{ needs.measure.outputs.os_build }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -B phase3/scripts/check_layout.py \
            --expected "measurements/${{ needs.measure.outputs.os_build }}" \
            --actual "$RUNNER_TEMP/run1" \
            --output layout-report.json \
            >> "$GITHUB_STEP_SUMMARY" || true

      # The levels the implementation claims. A regression here is a real
      # failure, which is what makes the claim worth anything.
      #
      # L4 is not in the list even though it is implemented: it is only as good
      # as the harvested metrics, and holding it green here would make a change
      # in the runner's font read as a bug in this repository. The step above
      # reports it either way.
      - name: Implemented levels still match
        run: |
          python3 -B phase3/scripts/check_layout.py \
            --expected "measurements/${{ needs.measure.outputs.os_build }}" \
            --actual "$RUNNER_TEMP/run1" \
            --levels L1,L2,L3

      # The committed derived metrics, on their own, against the same corpus.
      # They cover the text cases that need only a line height and the advance
      # of 'M'; every other text case must fail by naming the advance it has
      # not got. A case that instead lands close-but-wrong would mean the
      # derived file had started standing in for a harvest, which is the one
      # way this half could quietly stop meaning anything.
      - name: The derived metrics match or say why not
        run: |
          "$RUNNER_TEMP/layout-build/measure_cases" \
            phase3/xaml-db/cases "$RUNNER_TEMP/derived" phase3/xaml-db/fonts/derived
          python3 -B phase3/scripts/check_layout.py \
            --expected "measurements/${{ needs.measure.outputs.os_build }}" \
            --actual "$RUNNER_TEMP/derived" \
            --levels L4 \
            --output derived-report.json > /dev/null || true
          python3 - <<'PY'
          import json, sys
          report = json.load(open("derived-report.json"))
          level = report["levels"]["L4"]
          expected = "implementation failed: the metrics derived from"
          wrong = [m for m in report["mismatches"] if not m["detail"].startswith(expected)]
          print(f"L4 on the derived metrics alone: {level['passed']} of "
                f"{level['cases']} match, {level['failed']} await the harvest")
          if wrong:
              print("::error::a text case measured against the derived metrics "
                    "neither matched nor named a missing advance")
              for mismatch in wrong[:10]:
                  print(f"  {mismatch['case_id']} {mismatch['path']}: {mismatch['detail']}")
              sys.exit(1)
          if not level["passed"]:
              print("::error::the derived metrics matched no text case at all")
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('layout-report.json') != ''
        with:
          name: layout-report
          path: layout-report.json
